name: 编译 x86 OpenWrt 官方底座（同配置对照测速用）

on:
  workflow_dispatch:
    inputs:
      clean_ccache:
        description: '清理 ccache 后全新编译（改过插件列表时勾上）'
        type: boolean
        default: false

permissions:
  contents: write

# ==================== 环境变量 ====================
env:
  REPO_URL: https://github.com/openwrt/openwrt
  # 2026-09-25 起切换 openwrt-25.12（6.12 内核/MGLRU/apk；24.10 已于 2026-09 EOL）。
  # 25.12 packages feed 默认 Go 1.26（GO_DEFAULT_VERSION:=1.26），daed 的
  # go.mod requires go>=1.26 与 GOEXPERIMENT=simd 天然满足，无需 Go 升级补丁
  #（24.10 路径的失败实锤：run 35988684619 报 go 1.23.12 + unknown GOEXPERIMENT simd）。
  REPO_BRANCH: openwrt-25.12
  CONFIG_FILE: x86.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    # 只编 daed 一个变体（eBPF 内核态方案，与 360T7 版一致）
    strategy:
      fail-fast: false
      matrix:
        proxy: [daed]

    runs-on: ubuntu-22.04

    steps:
    # ---------- 1. 检出仓库 ----------
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 初始化构建编号
      run: echo "FILE_DATE=_$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

    # ---------- 2. 释放磁盘空间 ----------
    - name: 释放磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    # ---------- 3. 安装编译依赖 ----------
    - name: 安装编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt update -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj \
          fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged \
          help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "=== pahole 版本（daed 的 BTF 需要）==="
        pahole --version || echo "  未安装 pahole"

    # ---------- 4. 克隆 OpenWrt 官方源码 ----------
    - name: 克隆源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ---------- 5. 追加第三方软件源 ----------
    - name: 加载自定义 feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # ---------- 6. 更新并安装 feeds ----------
    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    # 官方 feeds 全量安装；第三方 feeds 按需安装（瘦身关键，见 360T7 版教训）
    - name: 安装 feeds 软件包
      run: |
        cd openwrt
        # 官方源（已由 diy-part1.sh 换成 jjm2473 fork）：全量
        ./scripts/feeds install -a -p packages
        ./scripts/feeds install -a -p luci
        ./scripts/feeds install -a -p routing
        # kenzok8/small：只要 daed 本体；可视化界面 luci-app-daed 由 files/ 直接烤入
        # 注意：官方 packages feed 也收录了 daed（1.24.0 旧版）且优先级更高，裸 install
        # 会装到旧版。feeds 脚本的 -f 对已安装的同名包是静默 no-op（只对 core 包生效），
        # 必须先 uninstall 再从 small 装，并断言符号链接换源成功（360T7 run#10 教训）：
        ./scripts/feeds uninstall daed
        ./scripts/feeds install -p small daed
        test -e package/feeds/small/daed || { echo "::error::daed 未从 small feed 注册！"; exit 1; }
        test ! -e package/feeds/packages/daed || { echo "::error::packages feed 的 daed 1.24.0 仍被注册！"; exit 1; }
        echo "✓ daed 符号链接: $(readlink package/feeds/small/daed)"
        # lucky / easytier：只装本体 + LuCI 界面 + 中文包
        ./scripts/feeds install lucky luci-app-lucky luci-i18n-lucky-zh-cn
        ./scripts/feeds install easytier luci-app-easytier luci-i18n-easytier-zh-cn
        # iStore 全家桶（linkease 官方推荐集成方式；lua 生态由 jjm2473 fork 提供）
        ./scripts/feeds install -d y -p istore luci-app-store
        ./scripts/feeds install -p nas_luci luci-app-quickstart luci-app-istorex \
          luci-app-linkease luci-app-ddnsto luci-app-diskman luci-app-unishare luci-nginxer
        # Nikki（feed 自带 mihomo-meta 内核，PROVIDES:=mihomo）
        ./scripts/feeds install -p nikki nikki luci-app-nikki luci-i18n-nikki-zh-cn mihomo-meta
        # PassWall（官方双 feed）
        # 核心 xray-core/sing-box/chinadns-ng 在 packages feed 也有旧版，
        # 沿用 daed 教训：先 uninstall 再从 passwall_packages 强装（-f 对已装包是 no-op）
        ./scripts/feeds install -p passwall_luci luci-app-passwall luci-i18n-passwall-zh-cn
        for p in xray-core sing-box chinadns-ng geoview; do
          ./scripts/feeds uninstall $p 2>/dev/null || true
          ./scripts/feeds install -p passwall_packages $p
        done
        # Docker
        ./scripts/feeds install dockerd docker docker-compose
        # Docker 管理插件换 iStoreOS 同款 luci-app-dockermanager（LinkEase 中文 UI）
        ./scripts/feeds install -p nas_luci luci-app-dockermanager luci-lib-linkeaseauth
        ./scripts/feeds install -p nas dockermanager linkease-app-entry
        # Argon 主题 + argon-config（run 36220035542 实锤：jjm2473 luci fork 和
        # small 都没有 argon；iStoreOS 官方同款 third feed 提供）
        ./scripts/feeds install -p third luci-theme-argon luci-app-argon-config \
          || { echo "::error::argon 从 third feed 注册失败！"; exit 1; }
        ./scripts/feeds install -p third luci-i18n-argon-config-zh-cn 2>/dev/null \
          || echo "（argon-config 中文包不存在于 third，跳过）"
        test -e package/feeds/third/luci-theme-argon || { echo "::error::luci-theme-argon 未注册！"; exit 1; }
        echo "===== 关键第三方包注册断言 ====="
        for p in nikki luci-app-nikki mihomo-meta luci-app-passwall xray-core sing-box chinadns-ng geoview \
                 luci-app-store luci-app-quickstart luci-app-istorex luci-theme-argon luci-app-argon-config \
                 dockermanager luci-app-dockermanager linkease-app-entry luci-lib-linkeaseauth; do
          found=$(ls -d package/feeds/*/$p 2>/dev/null | head -1)
          [ -n "$found" ] || { echo "::error::$p 未在任何 feed 中注册！"; exit 1; }
          echo "✓ $p -> $found"
        done
        echo "===== 各第三方 feed 实际注册的包 ====="
        for f in small lucky easytier istore nas nas_luci nikki passwall_packages passwall_luci; do
          echo "--- $f ---"; ls package/feeds/$f/ 2>/dev/null | head -30 || echo "（无）"
        done

    # ---------- 7. 注入私人信息 + 拼接编译配置 ----------
    - name: 注入私人信息
      env:
        ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        # 私人配置（Lucky 数据 / EasyTier config.toml）不在公开仓库里，
        # 编译期从私有仓库 x86-firmware-private 拉取，先合并进 files/
        # 【顺序至关重要】必须先合并私人配置、再统一拷贝进 openwrt/files/
        # （2026-09-23 修复：原顺序先拷贝后合并，私人配置从未进入固件）
        mkdir -p files
        # 对照测速固件：私人配置为可选项——token 失效/克隆失败时警告并继续，
        # 不阻塞编译（与 build.yml 的强校验版不同）
        if [ -n "$PRIVATE_REPO_TOKEN" ]; then
          if git clone --depth 1 \
            "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/CF012026/x86-firmware-private.git" \
            /tmp/private-files 2>/tmp/private-clone.err; then
            cp -a /tmp/private-files/files/. files/
            echo "===== 私人配置已合并（仅列文件名，不显示内容）====="
            find files/etc/config/lucky.daji files/etc/easytier -type f 2>/dev/null | sed 's/^/   /'
          else
            echo "::warning::私人配置仓库克隆失败（token 过期或无权限），对照固件跳过私人配置"
            cat /tmp/private-clone.err | tail -2
          fi
        else
          echo "::warning::未设置 PRIVATE_REPO_TOKEN，固件将不含 Lucky/EasyTier 私人配置"
        fi
        [ -e files ] && cp -r files openwrt/
        # 基础配置 + 该变体对应的代理后端配置
        cat $CONFIG_FILE proxy-${{ matrix.proxy }}.config > openwrt/.config
        echo "===== 使用的基础配置 + proxy-${{ matrix.proxy }}.config ====="
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # ---------- 7.5 私人配置落位断言（对照版：软校验，私人配置可选）----------
    - name: 私人配置落位检查
      run: |
        MISSING=0
        for f in files/etc/config/lucky files/etc/config/lucky.daji/lucky.conf \
                 files/etc/easytier/config.toml files/etc/config/easytier; do
          test -e "openwrt/$f" || { echo "::warning::openwrt/$f 不在（对照固件允许无私人配置）"; MISSING=1; }
        done
        if [ -e openwrt/files/etc/uci-defaults/98-root-password ]; then
          echo "✓ root 密码已落位"
        else
          echo "::warning::98-root-password 不在（未设 ROOT_PASSWORD Secret 或跳过注入）"
        fi
        [ "$MISSING" -eq 0 ] && echo "✓ 私人配置已全部落位 openwrt/files/" || true

    # ---------- 8. 生成配置并预下载依赖包 ----------
    - name: 生成配置并预下载
      run: |
        cd openwrt
        # 关键修复（run 36228468632/36229726317 两轮破案）：包元数据多层缓存
        # （tmp/info/ 的文件清单+md5 印章、tmp/.packageinfo、tmp/.config-*.in）
        # 在 diy-part2 事后拷入 eqos / 打 daed 补丁后不可靠，导致主 defconfig
        # 用的 Kconfig 缺 eqos 符号、daed 缺 NEED_BPF_TOOLCHAIN select，
        # conf 把对应 =y 静默丢弃。此处全量删除强制完整重扫。
        rm -rf tmp/info tmp/.packageinfo tmp/.config-package.in tmp/.config-target.in
        make defconfig
        # ---- 现场检查：此刻的 Kconfig/packageinfo 必须包含 eqos 与 daed 补丁 ----
        echo "===== step12 defconfig 后现场检查 ====="
        grep -q "config PACKAGE_luci-app-eqos" tmp/.config-package.in \
          && echo "✓ Kconfig 含 eqos 符号" || echo "✗✗ Kconfig 缺 eqos 符号（扫描层仍陈旧！）"
        grep -q "NEED_BPF_TOOLCHAIN" tmp/.packageinfo \
          && echo "✓ packageinfo 含 daed BPF 补丁" || echo "✗✗ packageinfo 缺 NEED_BPF_TOOLCHAIN（daed 未重扫！）"
        grep -q "^CONFIG_PACKAGE_luci-app-eqos=y" .config \
          && echo "✓ .config 已选中 eqos" || echo "✗✗ .config 未选中 eqos"
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    # ---------- 8.5 关键包生效校验（提前失败，避免白编 3 小时）----------
    - name: 校验关键包是否入选
      run: |
        cd openwrt
        echo "===== 关键包入选情况 ====="
        grep -E "^CONFIG_PACKAGE_(daed|lucky|easytier|dockerd|docker|docker-compose|luci-app-dockermanager|luci-app-store|luci-app-quickstart|luci-app-istorex|luci-i18n-base-zh-cn)=" .config || true
        FAILED=0
        # 代理后端
        grep -q "^CONFIG_PACKAGE_daed=y" .config || { echo "::error::daed 未被选中（多半是 BTF/XDP 依赖不满足）"; FAILED=1; }
        # BTF 四件套（daed crash 的根因，缺一不可；REDUCED=y 会静默砍掉 BTF）
        grep -q "^CONFIG_KERNEL_DEBUG_INFO_BTF=y" .config || { echo "::error::CONFIG_KERNEL_DEBUG_INFO_BTF 未开启 —— daed 必崩！"; FAILED=1; }
        grep -q "^CONFIG_KERNEL_DEBUG_INFO=y" .config || { echo "::error::CONFIG_KERNEL_DEBUG_INFO 未开启（BTF 的前置条件）"; FAILED=1; }
        grep -q "^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y" .config && { echo "::error::CONFIG_KERNEL_DEBUG_INFO_REDUCED 仍是=y，会把 BTF 静默砍掉！"; FAILED=1; }
        # luci-app-daede 已弃用
        grep -q "^CONFIG_PACKAGE_luci-app-daede=y" .config && { echo "::error::luci-app-daede 应已移除，不应再被选中"; FAILED=1; }
        # eBPF 工具链（新版 daed 编译期要用 clang 编 eBPF）：
        # diy-part2.sh 已给 daed Makefile 补了 +@NEED_BPF_TOOLCHAIN（上游标准机制），
        # defconfig 后应能看到 NEED_BPF_TOOLCHAIN=y 和 USE_LLVM_BUILD=y。
        # 注意：SDK_LLVM_BPF 挂在 SDK 条件下会被 defconfig 丢弃，不能作为判据
        #（2026-09-24 run 实锤：它被丢弃但 USE_LLVM_BUILD=y 正常落盘）。
        grep -q "^CONFIG_NEED_BPF_TOOLCHAIN=y" .config || { echo "::error::NEED_BPF_TOOLCHAIN 未生效 —— daed 工具链补丁可能没打上！"; FAILED=1; }
        grep -q "^CONFIG_USE_LLVM_BUILD=y" .config || { echo "::error::USE_LLVM_BUILD 未生效 —— llvm-bpf 工具链不会被构建！"; FAILED=1; }
        # 内核 BTF（daed 运行期 eBPF 硬依赖 + DAED_USE_KERNEL_BTF choice 的前提）：
        # run 36233262099 实锤：不开 BTF 时 daed 落到 vmlinux-btf 包分支（25.12 无此包）→ WARNING
        grep -q "^CONFIG_KERNEL_DEBUG_INFO_BTF=y" .config || { echo "::error::KERNEL_DEBUG_INFO_BTF 未生效 —— daed 运行期 eBPF 将不可用！"; FAILED=1; }
        grep -q "^CONFIG_DAED_USE_KERNEL_BTF=y" .config || { echo "::error::DAED_USE_KERNEL_BTF 未生效 —— daed BTF 源 choice 异常！"; FAILED=1; }
        # xray-core 版本钉子（26.9.9 要求 go1.27，25.12 只有 go1.26.8）
        grep -q "^PKG_VERSION:=26.7.28" package/feeds/passwall_packages/xray-core/Makefile || { echo "::error::xray-core 未钉到 26.7.28 —— go 版本不兼容会编译失败！"; FAILED=1; }
        # 核心 app（缺了直接拦下）
        for pkg in lucky luci-app-lucky easytier luci-app-easytier \
                   luci-theme-argon luci-app-argon-config \
                   dockerd docker docker-compose luci-app-dockermanager \
                   xz-utils \
                   luci-app-store luci-app-quickstart luci-app-istorex \
                   nikki luci-app-nikki mihomo-meta \
                   luci-app-passwall xray-core sing-box chinadns-ng; do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || { echo "::error::${pkg} 未被选中！"; FAILED=1; }
        done
        # 瘦身黑名单：这些包不允许出现在 .config（=m 也不行）
        # 注意：mihomo 是 mihomo-meta 的虚拟 PROVIDES 符号，不查；查真实内核包名
        for pkg in mihomo-alpha clashoo luci-app-clashoo momo luci-app-momo luci-app-fchomo; do
          grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]" .config && { echo "::error::瘦身失败：${pkg} 被拉进了编译配置！"; FAILED=1; }
        done
        # 软件空间校验
        grep -q "^CONFIG_TARGET_ROOTFS_PARTSIZE=4096" .config || { echo "::error::ROOTFS_PARTSIZE 不是 4096，软件空间 4G 未生效！"; FAILED=1; }
        [ "$FAILED" -eq 0 ] || exit 1

    # ---------- 9. 恢复 ccache ----------
    - name: 恢复 ccache
      if: ${{ !inputs.clean_ccache }}
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-x86-openwrt-${{ matrix.proxy }}-${{ github.sha }}
        restore-keys: |
          ccache-x86-openwrt-${{ matrix.proxy }}-

    # ---------- 10. 编译固件 ----------
    - name: 编译固件
      run: |
        cd openwrt
        export USE_CCACHE=1
        export CCACHE_DIR="$PWD/.ccache"
        export CCACHE_COMPILERCHECK=content
        export CCACHE_COMPRESS=1
        export CCACHE_MAXSIZE=2G
        echo "编译线程数: $(nproc)"
        make -j$(($(nproc) + 1)) || make -j1 || make -j1 V=s
        echo "FIRMWARE=$PWD/bin/targets/x86/64" >> $GITHUB_ENV

    # ---------- 10.5 产物 manifest 终检 ----------
    - name: 产物 manifest 终检
      run: |
        cd openwrt/bin/targets/x86/64
        MANIFEST=$(ls *.manifest | head -1)
        echo "===== $MANIFEST 关键包实际入选情况 ====="
        grep -E "^(daed|lucky|easytier|dockerd|docker|docker-compose|luci-app-dockermanager|luci-app-store|luci-app-quickstart|luci-app-istorex|nikki|luci-app-nikki|mihomo-meta|luci-app-passwall|xray-core|sing-box|chinadns-ng|luci-i18n-base-zh-cn) " "$MANIFEST" || true
        FAILED=0
        # 核心 app 终检
        for pkg in daed lucky luci-app-lucky easytier luci-app-easytier \
                   luci-theme-argon dockerd docker docker-compose luci-app-dockermanager \
                   luci-app-store luci-app-quickstart luci-app-istorex \
                   nikki luci-app-nikki mihomo-meta \
                   luci-app-passwall xray-core sing-box chinadns-ng; do
          grep -q "^${pkg} " "$MANIFEST" || { echo "::error::manifest 中没有 ${pkg}！"; FAILED=1; }
        done
        # daed 版本终检：必须是 small feed 的日期版快照，不许被 packages feed 抢占
        grep -E "^daed - " "$MANIFEST" | grep -qE "^daed - 20[0-9]{2}\." \
          || { echo "::error::daed 版本异常：$(grep '^daed ' $MANIFEST)（预期 small feed 快照）"; FAILED=1; }
        # 瘦身黑名单终检（mihomo 为 mihomo-meta 虚拟 PROVIDES，不查真实名）
        for pkg in mihomo-alpha clashoo luci-app-clashoo momo luci-app-momo luci-app-fchomo luci-app-daede luci-i18n-daede-zh-cn; do
          grep -qE "^${pkg} " "$MANIFEST" && { echo "::error::瘦身失败：${pkg} 混进了最终镜像！"; FAILED=1; }
        done
        [ "$FAILED" -eq 0 ] || exit 1
        echo "===== 镜像总体积 ====="
        ls -lh *.img.gz 2>/dev/null || ls -lh

    # ---------- 11. 整理产物 ----------
    - name: 整理固件
      if: ${{ !cancelled() }}
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "===== 编译产物 ====="
        ls -lh
        df -hT

    # ---------- 12. 上传固件（仅 Artifacts，需登录可见）----------
    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: X86-64-openwrt-${{ matrix.proxy }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30

    # ---------- 13. 发布到 Releases（公开直链、永久保留）----------
    - name: 发布到 Releases
      if: ${{ success() }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: openwrt-x86-${{ matrix.proxy }}-${{ env.FILE_DATE }}
        name: X86-64 OpenWrt ${{ matrix.proxy }} ${{ env.FILE_DATE }}
        files: |
          ${{ env.FIRMWARE }}/*combined-efi*.img.gz
        body: |
          X86_64 OpenWrt 官方底座固件
          - combined-efi img.gz: 写盘/直刷镜像（Etcher 直接写 .img.gz，无需解压）
          内置: daed / iStore 全家桶 / luci-app-dockermanager / nikki / passwall / lucky / easytier / 中文语言包

    # ---------- 13. 失败时上传配置诊断快照 ----------
    - name: 上传诊断快照
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && failure() }}
      with:
        name: config-debug-openwrt-${{ matrix.proxy }}${{ env.FILE_DATE }}
        path: |
          openwrt/.config
          openwrt/tmp/.config-package.in
          openwrt/tmp/.packageinfo
        retention-days: 14
